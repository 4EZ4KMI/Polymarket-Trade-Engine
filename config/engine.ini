# ================================================================
# Polymarket BTC 5m/15m Quantitative Trading Engine Configuration
# Institutional Micro-Scalping, Parity Arbitrage & Flow Skew
# Mode: PAPER TRADING ONLY
# ================================================================

[engine]
http_port = 8080
log_dir = data/logs
initial_capital = 10000.0
feed_port = 9999
dataset_path = data/live_stream.bin


[execution]
latency_submit_ack_ms = 1.5
latency_ack_fill_ms = 1.0
latency_cancel_ms = 1.5
queue_model = 2 # 1=Conservative, 2=Realistic, 3=Aggressive
slippage_bps = 1.0
adverse_selection_bps = 2.0
live_trading_enabled = 0

[fees]
maker_fee_bps = 0.0
taker_fee_bps = 2.0
maker_rebate_bps = 0.5
dynamic_fee_scale = 1.0

[risk]
max_position_per_market = 2000.0
max_total_exposure = 10000.0
max_order_size_shares = 1000.0
max_daily_loss = 200.0
max_drawdown = 300.0
max_consecutive_losses = 5
max_spread_for_entry = 0.04
min_confidence_floor = 0.50
max_orders_per_sec = 50
max_latency_ms = 100.0

[strategy_arb]
min_edge_pct = 0.005
min_liquidity = 10
max_loss_per_trade = 10.0
requote_tolerance = 0.005
allow_requote = 1
max_unhedged_time_ms = 500.0
max_unhedged_size = 500
hedge_timeout_ms = 1000.0

[strategy_flow]
model_type = 1 # 1=Heuristic, 2=Empirical, 3=Logistic
min_btc_momentum_pct = 0.0001
min_btc_velocity = 5.0
min_polymarket_imbalance = 0.05
max_polymarket_spread = 0.04
min_expected_edge = 0.005
min_confidence = 0.50
default_order_size = 100
time_to_expiry_min_sec = 30.0
time_to_expiry_max_sec = 900.0
